<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#177f78"><title>Whole Person Consulting Studio</title><style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f5;color:#183a4d;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;padding:32px;text-align:center}.spinner{width:42px;height:42px;border:4px solid #dce3e5;border-top-color:#177f78;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#6c7880;line-height:1.5}</style></head><body><div class="box"><div class="spinner"></div><h2>Loading Whole Person Consulting Studio</h2><p>Preparing the integrated PI + CliftonStrengths workspace…</p></div><script>
(async()=>{try{const base='https://raw.githubusercontent.com/joshaw864-rgb/pi-clifton-consulting-studio/main/payload/';const parts=['c001','c002a','c002b','c002c','c002d','c003','c004a','c004b','c004c','c004d','c005','c006','c007','c008'];let b64='';for(const n of parts){const r=await fetch(base+n+'.txt',{cache:'no-store'});if(!r.ok)throw new Error('payload '+n);b64+=(await r.text()).trim();}const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('This browser needs a newer version to open the studio.');const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close();}catch(e){document.body.innerHTML='<div class="box"><h2>Could not load the studio</h2><p>'+e.message+'</p><p>Please refresh the page. If the issue continues, update your browser and try again.</p></div>';console.error(e);}})();
</script></body></html>
