    const valid=uniq(supplied).filter(n=>THEMES[n]);
    const expected=c.profileType==='Full34'?34:c.profileType==='Top10'?10:5;
    const quality={status:valid.length>=Math.min(expected,5)?'usable':'limited',messages:[]};
    if(valid.length<Math.min(expected,5)) quality.messages.push('Fewer than five valid Clifton themes were supplied.');
    if(valid.length<expected) quality.messages.push(`${c.profileType||'Top5'} was selected but ${valid.length} ranked themes were provided.`);
    const ranked=valid.map((name,i)=>({rank:i+1,band:rankBand(i+1),theme:THEMES[name]}));
    const top5=ranked.slice(0,5), top10=ranked.slice(0,10);
    const domainCounts={Executing:0,Influencing:0,'Relationship Building':0,'Strategic Thinking':0};
    top10.forEach(r=>domainCounts[r.theme.domain]++);
    const pairDynamics=[];
    for(let i=0;i<top10.length;i++) for(let j=i+1;j<top10.length;j++){
      const a=top10[i].theme.name,b=top10[j].theme.name;
      const rule=K.clifton.pairs.find(p=>(p.a===a&&p.b===b)||(p.a===b&&p.b===a));
      if(rule) pairDynamics.push({...rule,ranks:[top10[i].rank,top10[j].rank],salience:22-(top10[i].rank+top10[j].rank)});
    }
    pairDynamics.sort((a,b)=>b.salience-a.salience);
    return {quality,profileType:c.profileType||'Top5',ranked,top5,top10,domainCounts,pairDynamics};
  }

  function addDimension(store,code,amount,evidence){
    if(!store[code]) store[code]={code,label:DIM[code]?.label||code,raw:0,evidence:[],positive:0,negative:0};
    const weighted=Number(amount)||0;
    store[code].raw+=weighted;
    if(weighted>=0) store[code].positive+=weighted; else store[code].negative+=Math.abs(weighted);
    store[code].evidence.push({...evidence,amount:weighted});
  }

  function calculateDimensions(piA,cliftonA){
    const store={};
    if(piA.mode==='full'){
      piA.factors.forEach(f=>{
        const dir=f.direction;
        if(dir==='situational') return;
        const key=`${f.code}_${dir}`;
        const map=K.pi.dimension_map[key]||{};
        const intensity=Math.min(1,Math.max(.25,Math.abs(f.value)/2.5));
        Object.entries(map).forEach(([d,v])=>addDimension(store,d,v*intensity,{source:'PI factor',label:`${f.code} ${f.band.band_label}`,detail:f.contribution}));
      });
      piA.combinations.slice(0,4).forEach(c=>{
        if(c.balanced) return;
        const map=K.pi.dimension_map[c.code]||{};
        const intensity=Math.min(1,Math.max(.2,c.spread/3));
        Object.entries(map).forEach(([d,v])=>addDimension(store,d,v*intensity,{source:'PI combination',label:`${c.code} ${c.orientation}`,detail:c.productive}));
      });
    } else if(piA.referenceProfile){
      Object.entries(piA.referenceProfile.representative_pattern).forEach(([f,v])=>{
        const dir=directionFor(v); if(dir==='situational') return;
        const map=K.pi.dimension_map[`${f}_${dir}`]||{};
        Object.entries(map).forEach(([d,val])=>addDimension(store,d,val*.35,{source:'PI profile shorthand',label:piA.referenceProfile.name,detail:piA.referenceProfile.snapshot}));
      });
    }
    cliftonA.ranked.forEach(r=>{
      const editorialWeight=r.rank<=5?1:r.rank<=10?.65:r.rank<=20?.3:.12;
      Object.entries(r.theme.dimensions||{}).forEach(([d,v])=>addDimension(store,d,v*editorialWeight,{source:'Clifton theme',label:`#${r.rank} ${r.theme.name}`,detail:r.theme.contribution}));
    });
    Object.values(store).forEach(d=>{
      const totalAbs=d.positive+d.negative;
      d.mixed=d.positive>=1.2 && d.negative>=1.2;
      d.value=clamp(Math.round((d.raw/(Math.max(3,totalAbs)))*100),-100,100);
      d.salience=Math.round(totalAbs*20);
      d.sources=uniq(d.evidence.map(e=>e.source));
    });
    return store;
  }

  function ruleMatches(rule,piA,cliftonA){
    const themeRank=cliftonA.ranked.find(r=>r.theme.name===rule.theme)?.rank;
    if(!themeRank || themeRank>10) return false;
    if(rule.pi_factor){
      if(piA.mode!=='full') return false;
      const f=piA.factors.find(x=>x.code===rule.pi_factor);
      return f && f.direction===rule.pi_direction;
    }
    if(rule.pi_combination) return piA.topCombinations.some(c=>c.code===rule.pi_combination);
    return false;
  }

  function confidenceFor(person,evidence,{mixed=false,confirmed=false}={}){
    let score=20;
    const piFull=person.pi?.mode!=='profile_only' && person.pi?.self;
    const cliftonCount=(person.clifton?.ranks||[]).filter(Boolean).length;
    score += piFull && cliftonCount>=5 ? 20 : piFull||cliftonCount>=5 ? 12 : 5;
    const salience=evidence.reduce((m,e)=>Math.max(m,Math.abs(e.amount||0)),0);
    score += salience>=2?15:salience>=1?10:6;
    const sources=uniq(evidence.map(e=>e.source));
    score += sources.some(s=>s.startsWith('PI')) && sources.some(s=>s==='Clifton theme') ? 20 : 10;
    if((person.role||'').trim() || (person.challenge||'').trim() || (person.purpose||'').trim()) score += 15;
    if((person.examples||'').trim() || confirmed) score += 10;
    if(mixed) score -= 8;
    score=clamp(Math.round(score),0,100);
    const label=score>=85?'Strong':score>=70?'Supported':score>=50?'Exploratory':'Withhold';
    return {score,label};
  }

  function createIntegratedInsights(person,piA,cliftonA,dimensions){
    const insights=[];
    K.integration.cross_rules.forEach(rule=>{
      if(ruleMatches(rule,piA,cliftonA)){
        const evidence=[];
        if(rule.pi_factor){
          const f=piA.factors.find(x=>x.code===rule.pi_factor);
          evidence.push({source:'PI factor',label:`${f.code} ${f.band.band_label}`,detail:f.contribution,amount:Math.abs(f.value)});
        }
        if(rule.pi_combination){
          const c=piA.topCombinations.find(x=>x.code===rule.pi_combination);
          evidence.push({source:'PI combination',label:`${c.code} ${c.orientation}`,detail:c.productive,amount:c.spread});
        }
        const tr=cliftonA.ranked.find(r=>r.theme.name===rule.theme);
        evidence.push({source:'Clifton theme',label:`#${tr.rank} ${tr.theme.name}`,detail:tr.theme.contribution,amount:tr.rank<=5?2:1});
        const confidence=confidenceFor(person,evidence,{mixed:rule.type==='constructive_tension'});
        insights.push({id:rule.id,type:rule.type,title:rule.title,summary:rule.summary,evidence,confidence,
          validationQuestion:`Where do you see this combination most clearly in your current role—and where does it show up differently?`,priority:100+(confidence.score)});
      }
    });

    const dims=Object.values(dimensions).sort((a,b)=>b.salience-a.salience);
    dims.forEach((d,index)=>{
      if(insights.length>=10 && index>6) return;
      const lang=DIMENSION_LANGUAGE[d.code]; if(!lang) return;
      const mixed=d.mixed || (d.positive>=1 && d.negative>=1);
      let title,summary,type='channeling';
      if(mixed){ title=lang.tensionTitle; summary=lang.tension; type='constructive_tension'; }
      else if(d.raw>=0){ title=lang.highTitle; summary=lang.high; type=d.sources.length>1?'reinforcement':'channeling'; }
      else { title=lang.lowTitle; summary=lang.low; type=d.sources.length>1?'reinforcement':'channeling'; }
      if(insights.some(i=>i.title===title)) return;
      const confidence=confidenceFor(person,d.evidence,{mixed});
      if(confidence.label==='Withhold') return;
      insights.push({id:`DIM_${d.code}`,type,title,summary,evidence:d.evidence.slice(0,5),confidence,
        validationQuestion:`What recent example best confirms—or challenges—this interpretation of ${d.label.toLowerCase()}?`,priority:70+d.salience+confidence.score/5});
    });

    // PI adaptation is deliberately framed as an environmental hypothesis.
    piA.adaptation.slice(0,3).forEach(a=>{
      const evidence=[{source:'PI adaptation',label:`${a.factor_code} shift ${formatFactor(a.from)} → ${formatFactor(a.to)}`,detail:a.perceived_demand,amount:Math.abs(a.shift)}];
      const confidence=confidenceFor(person,evidence,{mixed:a.midpointCrossed});
      insights.push({id:`ADAPT_${a.factor_code}`,type:'context_activation',title:`Current role may be asking for more ${a.direction==='higher'?FACTOR_SHORT[a.factor_code].high.toLowerCase():FACTOR_SHORT[a.factor_code].low.toLowerCase()} behavior`,
        summary:`${a.client_stem} ${a.energy_cost_hypothesis}`,evidence,confidence,validationQuestion:a.validation_question,priority:88+Math.abs(a.shift)*10});
    });

    // A≈D deserves its own decision hypothesis.
    if(piA.adSpecial){
      const evidence=[{source:'PI special relationship',label:'A approximately equals D',detail:piA.adSpecial.summary,amount:1.5}];
      const confidence=confidenceFor(person,evidence,{mixed:true});
      insights.push({id:'AD_EQUAL',type:'constructive_tension',title:'A pull to decide and a pull to be certain',summary:piA.adSpecial.summary,evidence,confidence,validationQuestion:piA.adSpecial.question,priority:94});
    }

    // Clifton pair dynamics add another within-system layer without overpowering the integrated headlines.
    cliftonA.pairDynamics.slice(0,3).forEach(p=>{
      const a=cliftonA.ranked.find(r=>r.theme.name===p.a), b=cliftonA.ranked.find(r=>r.theme.name===p.b);
      const evidence=[
        {source:'Clifton theme',label:`#${a.rank} ${p.a}`,detail:a.theme.contribution,amount:a.rank<=5?2:1},
        {source:'Clifton theme',label:`#${b.rank} ${p.b}`,detail:b.theme.contribution,amount:b.rank<=5?2:1},
      ];
      const confidence=confidenceFor(person,evidence,{mixed:p.type==='constructive_tension'});
      insights.push({id:`PAIR_${slug(p.a)}_${slug(p.b)}`,type:p.type,title:`${p.a} + ${p.b}`,summary:p.summary,evidence,confidence,
        validationQuestion:`When do ${p.a} and ${p.b} strengthen one another, and when do they pull you in different directions?`,priority:72+p.salience});
    });

    insights.sort((a,b)=>b.priority-a.priority);
    const seen=new Set();
    return insights.filter(i=>{ const key=i.title.toLowerCase(); if(seen.has(key)) return false; seen.add(key); return true; }).slice(0,12);
  }

  function collectNeeds(piA,cliftonA){
    const needs=[];
    piA.factors.forEach(f=>f.needs.slice(0,3).forEach(n=>needs.push({text:n,source:`PI ${f.code}`})));
    cliftonA.top5.forEach(r=>r.theme.needs.slice(0,2).forEach(n=>needs.push({text:n,source:r.theme.name})));
    const out=[]; const seen=new Set();
    needs.forEach(n=>{const key=n.text.toLowerCase(); if(!seen.has(key)){seen.add(key);out.push(n);}});
    return out.slice(0,10);
  }

  function analyzePerson(person){
    const p=clone(person||{});
    p.id=p.id||`person_${Date.now()}`;
    p.name=p.name||'Unnamed Person';
    const pi=analyzePI(p), clifton=analyzeClifton(p), dimensions=calculateDimensions(pi,clifton);
    const insights=createIntegratedInsights(p,pi,clifton,dimensions);
    const topInsights=insights.filter(i=>i.confidence.label!=='Withhold').slice(0,7);
    const development=insights.filter(i=>i.type==='constructive_tension'||i.type==='moderation'||i.type==='context_activation').slice(0,3);
    const themeOveruses=clifton.top5.map(r=>({theme:r.theme.name,text:r.theme.overuse,question:r.theme.coaching_question}));
    const piPressure=pi.factors.map(f=>({factor:f.code,text:f.pressure}));
    const needs=collectNeeds(pi,clifton);
    const domainLead=Object.entries(clifton.domainCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
    return {person:p,pi,clifton,dimensions,insights,topInsights,development,themeOveruses,piPressure,needs,domainLead,
      overallConfidence:confidenceFor(p,topInsights.flatMap(i=>i.evidence),{mixed:topInsights.some(i=>i.type==='constructive_tension')})};
  }

  const REL_GUIDANCE={
    agency_autonomy:{shared:'Clarify who owns which decision so shared strength does not become a control contest or mutual hesitation.',difference:'Name decision rights early: one person may need autonomy while the other naturally builds shared ownership.'},
    social_energy_external_processing:{shared:'Agree on airtime and processing rhythm so similar styles do not crowd out missing perspectives.',difference:'Use a two-step rhythm: time to think, followed by deliberate conversation. Do not interpret quiet as disengagement or talking as a final answer.'},
    pace_responsiveness:{shared:'Use explicit checkpoints; two fast people may overrun detail, while two steady people may let urgency remain implicit.',difference:'Set response-time expectations. One person may experience pace as momentum while the other experiences the same pace as avoidable pressure.'},
    structure_precision:{shared:'Agree what “right” requires so shared precision does not become overengineering—or shared flexibility does not become ambiguity.',difference:'Separate non-negotiable standards from freedom of method. This protects both quality and autonomy.'},
    risk_decision_threshold:{shared:'Define what evidence is enough and who makes the final call.',difference:'Use reversible versus irreversible decisions: move faster on the first and create more review on the second.'},
    execution_ownership:{shared:'Make workload and ownership visible so two high owners do not duplicate or rescue one another.',difference:'Use explicit handoffs, milestones and definitions of done.'},
    problem_solving_thinking:{shared:'Decide when exploration ends and execution begins.',difference:'Let the deeper thinker frame the issue and the practical mover test the next step; then reconvene around evidence.'},
    relationship_depth_trust:{shared:'Protect trust with direct expectations and consistent follow-through.',difference:'Do not force identical relationship depth. Define what professional trust requires even when personal closeness differs.'},
    influence_visibility:{shared:'Share the stage and define whose voice leads in which setting.',difference:'Use one person for visible advocacy and the other for substance, credibility or behind-the-scenes alignment.'},
    change_ambiguity:{shared:'Create a clear learning loop so shared change appetite does not become churn—or shared stability does not become avoidance.',difference:'Pair a stable anchor with an agreed experiment. Name what remains constant while the method changes.'},
    conflict_candor:{shared:'Agree on rules for productive disagreement before pressure rises.',difference:'The direct person should signal care; the harmony-seeking person should state the disagreement before searching for common ground.'},
    learning_information:{shared:'Define the decision question and a finish line for research.',difference:'Provide concise essentials first, with deeper material available rather than required for everyone.'},
    standards_excellence:{shared:'Define where excellence truly matters and what “good enough” means elsewhere.',difference:'Agree on the quality threshold before work begins so critique does not feel like a moving target.'},
    purpose_values:{shared:'Translate shared values into observable behaviors rather than assuming agreement on every method.',difference:'Clarify the common purpose and allow different motivations to support it.'},
    recognition_motivation:{shared:'Make recognition specific and tied to contribution.',difference:'Learn whether each person values public visibility, private trust, challenge, belonging or autonomy.'},
  };

  function compareDimensions(a,b){
    const rows=[];
    K.ontology.forEach(d=>{
      const av=a.dimensions[d.code]?.value||0,bv=b.dimensions[d.code]?.value||0;
      const diff=Math.abs(av-bv),sameDir=Math.sign(av)===Math.sign(bv) || Math.abs(av)<15 || Math.abs(bv)<15;
      let type;
      if(diff>=65) type='strong_difference';
      else if(diff>=35) type='difference';
      else if(sameDir && Math.abs(av)>=45 && Math.abs(bv)>=45) type='shared_amplification';
      else type='shared_or_flexible';
      rows.push({code:d.code,label:d.label,a:av,b:bv,diff,type,guidance:(type==='difference'||type==='strong_difference')?REL_GUIDANCE[d.code].difference:REL_GUIDANCE[d.code].shared});
    });
    return rows;
  }

  function analyzeRelationship(personA,personB,relationshipType='peer'){
    const a=analyzePerson(personA), b=analyzePerson(personB), comparisons=compareDimensions(a,b);
    const differences=comparisons.filter(c=>c.type==='strong_difference'||c.type==='difference').sort((x,y)=>y.diff-x.diff).slice(0,5);
    const shared=comparisons.filter(c=>c.type==='shared_amplification').sort((x,y)=>Math.abs(y.a)+Math.abs(y.b)-Math.abs(x.a)-Math.abs(x.b)).slice(0,4);
    const crossPairs=[];
    a.clifton.top5.forEach(ta=>b.clifton.top5.forEach(tb=>{
      const rule=K.clifton.pairs.find(p=>(p.a===ta.theme.name&&p.b===tb.theme.name)||(p.a===tb.theme.name&&p.b===ta.theme.name));
      if(rule) crossPairs.push({...rule,fromA:ta.theme.name,fromB:tb.theme.name});
    }));
    const agreements=[];
    [...differences,...shared].slice(0,6).forEach(c=>agreements.push(c.guidance));
    const powerNotes={
      manager_direct_report:'The manager holds more formal power. Recommendations should make expectations, decision rights and feedback safety explicit.',
      direct_report_manager:'The direct report may need to translate needs upward while recognizing the manager’s decision authority.',
      peer:'Neither person should rely on title to resolve ambiguity; shared ownership and escalation rules matter.',
      leadership_partner:'Clarify which leader owns the final decision and how disagreement will be presented to the broader team.',
      consultant_client:'The consultant owns the quality of the process; the client owns the business decision. Avoid confusing influence with authority.',
      cofounder_partner:'Strategic disagreement can carry identity and equity implications. Decision domains and deadlock rules should be explicit.'
    };
    return {type:relationshipType,a,b,comparisons,differences,shared,crossPairs:crossPairs.slice(0,5),agreements:uniq(agreements).slice(0,6),powerNote:powerNotes[relationshipType]||powerNotes.peer};
  }

  function analyzeTeam(team,people){
    const analyses=(people||[]).map(analyzePerson);
    const themeFreq={},domainCounts={Executing:0,Influencing:0,'Relationship Building':0,'Strategic Thinking':0};
    analyses.forEach(a=>{
      a.clifton.top5.forEach(r=>{themeFreq[r.theme.name]=(themeFreq[r.theme.name]||0)+1;domainCounts[r.theme.domain]++;});
    });
    const factors={}; ['A','B','C','D'].forEach(f=>{
      const vals=analyses.filter(a=>a.pi.mode==='full').map(a=>a.pi.self[f]);
      factors[f]={count:vals.length,avg:vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0,min:vals.length?Math.min(...vals):0,max:vals.length?Math.max(...vals):0};
    });
    const dimensions={};
    K.ontology.forEach(d=>{
      const vals=analyses.map(a=>a.dimensions[d.code]?.value||0);
      dimensions[d.code]={code:d.code,label:d.label,avg:vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0,min:vals.length?Math.min(...vals):0,max:vals.length?Math.max(...vals):0,range:vals.length?Math.max(...vals)-Math.min(...vals):0};
    });
    const domainsSorted=Object.entries(domainCounts).sort((a,b)=>b[1]-a[1]);
    const themeSorted=Object.entries(themeFreq).sort((a,b)=>b[1]-a[1]);
    const lessRepresented=domainsSorted.length?domainsSorted.filter(([,n])=>n===Math.min(...domainsSorted.map(x=>x[1]))).map(x=>x[0]):[];
    const dimRows=Object.values(dimensions);
    const strongest=dimRows.sort((a,b)=>Math.abs(b.avg)-Math.abs(a.avg)).slice(0,5);
    const widest=[...dimRows].sort((a,b)=>b.range-a.range).slice(0,5);
    const agreements=[];
    widest.slice(0,3).forEach(d=>agreements.push(REL_GUIDANCE[d.code].difference));
    strongest.slice(0,3).forEach(d=>agreements.push(REL_GUIDANCE[d.code].shared));
    return {team:{name:team?.name||'Unnamed Team',challenge:team?.challenge||'',strategy:team?.strategy||''},analyses,count:analyses.length,themeFrequency:themeSorted,domainCounts,factors,dimensions,strongest,widest,lessRepresented,agreements:uniq(agreements).slice(0,7),privacyWarning:analyses.length<3?'With fewer than three people, treat this as a small-group working guide rather than anonymous team analytics.':''};
  }

  function selfTest(){
    const tests=[];
    function ok(name,fn){try{const value=fn();tests.push({name,pass:!!value,value});}catch(e){tests.push({name,pass:false,error:e.message});}}
    const sample={name:'Test Leader',role:'Operations Director',challenge:'Delegate more without losing quality',purpose:'Leadership self-awareness',examples:'Often takes work back when deadlines slip.',pi:{mode:'full',self:{A:1.6,B:.9,C:-1.4,D:.8},selfConcept:{A:1.1,B:1.3,C:-1.8,D:1.4},referenceProfile:'Captain',mSelf:24,mSelfConcept:26},clifton:{profileType:'Top5',ranks:['Achiever','Strategic','Relator','Restorative','Competition']}};
    const a=analyzePerson(sample);
    ok('34 Clifton themes loaded',()=>Object.keys(THEMES).length===34);
    ok('17 PI profiles loaded',()=>Object.keys(PROFILES).length===17);
    ok('PI factor analysis returns four factors',()=>a.pi.factors.length===4);
    ok('PI combination analysis returns six combinations',()=>a.pi.combinations.length===6);
    ok('Integrated insights are created',()=>a.insights.length>=6);
    ok('Confidence is not withheld',()=>a.overallConfidence.label!=='Withhold');
    const rel=analyzeRelationship(sample,{...sample,id:'two',name:'Test Peer',pi:{...sample.pi,self:{A:-1.2,B:-1.4,C:1.5,D:1.8}},clifton:{profileType:'Top5',ranks:['Deliberative','Responsibility','Harmony','Analytical','Discipline']}},'peer');
    ok('Relationship analysis identifies differences',()=>rel.differences.length>0);
    const team=analyzeTeam({name:'Test Team'},[sample,{...sample,id:'two',name:'Test Peer'}]);
    ok('Team analysis counts people',()=>team.count===2);
    return {pass:tests.every(t=>t.pass),tests};
  }

  global.StudioEngine={
    knowledge:K,themeMap:THEMES,profileMap:PROFILES,dimensionMap:DIM,
    analyzePI,analyzeClifton,analyzePerson,analyzeRelationship,analyzeTeam,
    bandFor,directionFor,formatFactor,rankBand,escapeHtml:esc,selfTest,slug
  };
})(window);
</script><script>(function(){
  'use strict';
  const E=window.StudioEngine;
  const K=window.STUDIO_KNOWLEDGE;
  const STORAGE_KEY='pi_clifton_studio_workspace_v1_1';
  let storageAvailable=true;
  let memoryWorkspace=null;
  function storageGet(){ try{return localStorage.getItem(STORAGE_KEY);}catch(err){storageAvailable=false;return memoryWorkspace;} }
  function storageSet(value){ memoryWorkspace=value; try{localStorage.setItem(STORAGE_KEY,value);storageAvailable=true;}catch(err){storageAvailable=false;} }
  const THEME_NAMES=K.clifton.themes.map(t=>t.name);
  const PROFILE_NAMES=K.pi.reference_profiles.map(p=>p.name);
  const $=(sel,root=document)=>root.querySelector(sel);
  const $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
  const esc=E.escapeHtml;

  const samplePeople=[];

  const defaultWorkspace=()=>({version:'1.1',people:[],teams:[],settings:{activeView:'dashboard'},createdAt:new Date().toISOString()});
  let workspace=loadWorkspace();
  let state={view:workspace.settings?.activeView||'dashboard',editingPersonId:workspace.people[0]?.id||null,draftPerson:null,personReportMode:'quick',relationship:null,teamAnalysis:null,libraryQuery:''};

  function loadWorkspace(){
    try{
      const raw=storageGet();
      if(raw){ const data=JSON.parse(raw); if(Array.isArray(data.people)) return data; }
    }catch(err){ console.warn('Workspace load failed',err); }
    const ws=defaultWorkspace(); storageSet(JSON.stringify(ws)); return ws;
  }
  function saveWorkspace(){
    workspace.settings={...(workspace.settings||{}),activeView:state.view};
    storageSet(JSON.stringify(workspace));
  }
  function uid(prefix='item'){ return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`; }
  function personById(id){ return workspace.people.find(p=>p.id===id); }
  function analysisFor(id){ const p=personById(id); return p?E.analyzePerson(p):null; }
  function setView(view){ state.view=view; saveWorkspace(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

  function icon(name){
    const icons={
      home:'<path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

  function initials(name){ return String(name||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase(); }

  function humanFactorLabel(code,value){
    const band=E.bandFor(code,Number(value)||0);
    return band?.descriptor ? band.descriptor.charAt(0).toUpperCase()+band.descriptor.slice(1) : 'Context-dependent';
  }
  function factorRelationalSentence(f){
    const strong=Math.abs(f.value)>=1.5;
    const hi=f.value>=0.45, lo=f.value<=-0.45;
    const lead=strong?'There is a strong pull here: ':'';
    if(f.code==='A') return lead+(hi?'you are likely to want real ownership and enough room to put your thumbprint on the outcome. You may ask for input, but you probably do not need consensus on every step.':lo?'you are likely to work through collaboration and shared success. You may naturally make room for other voices before pushing your own agenda.':'you can move between taking the lead and sharing ownership depending on what the situation needs.');
    if(f.code==='B') return lead+(hi?'interaction is likely to create energy. Talking something through can be part of how you think, connect and build momentum.':lo?'you probably do some of your best thinking before you speak. Quiet does not mean disengaged; it often means you are processing, observing or deciding what is worth saying.':'you can be social or reflective without needing either mode all the time. Context and trust probably matter more than sheer amount of interaction.');
    if(f.code==='C') return lead+(hi?'you are likely to value steadiness, continuity and enough time to let things settle. Sudden changes may be easier when the reason and path are clear.':lo?'you are likely to create pace. Variety, movement and multiple priorities can feel energizing, while repetition or unnecessary delay can feel heavier than it does to others.':'you can flex between urgency and steadiness; the rest of the pattern is more likely to determine your visible pace.');
    if(f.code==='D') return lead+(hi?'clarity matters. You are likely to feel more confident when expectations, standards and the definition of “right” are visible.':lo?'you are likely to prefer room to use judgment rather than being boxed in by process. You may care more about the outcome than following a prescribed route to get there.':'you can work with structure without needing structure to run the show. You likely flex based on risk, expertise and what the work requires.');
    return f.contribution;
  }
  function factorHumanInput(code,value){ return humanFactorLabel(code,value); }
  function humanEvidenceLabel(e){
    if(e.source==='PI factor') return 'PI behavioral drive';
    if(e.source==='PI combination') return 'PI factor relationship';
    if(e.source==='PI adaptation') return 'Current-environment adaptation';
    if(e.source==='PI special relationship') return 'PI decision pattern';
    if(e.source==='Clifton theme') return String(e.label||'Clifton theme').replace(/^#\d+\s+/, '');
    return e.label||e.source||'Evidence';
  }
  function wordsThatFit(a){
    const out=[];
    a.pi.factors.forEach(f=>out.push(humanFactorLabel(f.code,f.value)));
    a.clifton.top5.forEach(r=>(r.theme.keywords||[]).slice(0,2).forEach(k=>out.push(k)));
    return [...new Set(out.map(x=>String(x).trim()).filter(Boolean))].slice(0,12);
  }

  function factorInput(group,label,values,show=true){
    if(!show) return '';
    return `<div class="factor-group"><div class="factor-group-title"><strong>${label}</strong><span>Enter the exact position from the PI graph. Reports translate it into plain language.</span></div>${['A','B','C','D'].map(f=>`
      <div class="factor-row">
        <div class="factor-label"><span class="factor-letter factor-${f.toLowerCase()}">${f}</span><span><strong>${FACTOR_NAMES_UI[f]}</strong><small>${FACTOR_POLES[f]}</small></span></div>
        <input type="range" min="-3" max="3" step="0.05" value="${values?.[f]??0}" data-factor-range="${group}.${f}" aria-label="${label} ${f}">
        <input type="number" min="-3" max="3" step="0.05" value="${values?.[f]??0}" data-factor-number="${group}.${f}" aria-label="${label} ${f} numeric value">
        <div class="factor-human" data-factor-human="${group}.${f}">${factorHumanInput(f,values?.[f]??0)}</div>
      </div>`).join('')}</div>`;
  }
  const FACTOR_NAMES_UI={A:'Dominance',B:'Extraversion',C:'Patience',D:'Formality'};
  const FACTOR_POLES={A:'Collaborative ↔ Independent',B:'Reserved ↔ Sociable',C:'Driving ↔ Steady',D:'Flexible ↔ Precise'};

  function personEditor(p){

    return `<form id="personForm" class="editor-card" data-id="${p.id}">
      <div class="editor-heading"><div><span class="eyebrow">Profile input</span><h2>${isNew?'New individual':esc(p.name)}</h2><p>Use the data points as evidence, then add enough real-world context to make the interpretation feel like a person rather than a score.</p></div><div class="editor-status">${isNew?'Unsaved':'Saved locally'}</div></div>
      <details class="form-section" open><summary><span>1</span>Person and purpose</summary><div class="form-section-body grid-2">
        ${field('Name','name',p.name,'text','Required')}${field('Role','role',p.role,'text','e.g., Operations Director')}
        ${field('Organization','organization',p.organization,'text','Optional')}${selectField('Primary purpose','purpose',p.purpose,['Leadership self-awareness','Manager development','Coaching preparation','Role and environment fit','Interview readback','Relationship effectiveness','Team development'])}
        ${selectField('Audience','audience',p.audience,['Person themselves','Manager','Manager and person','Coach / consultant','Executive leader','HR / talent leader'])}
        <label class="field span-2"><span>Current challenge or context</span><textarea name="challenge" rows="3" placeholder="What is happening now that the report should help with?">${esc(p.challenge||'')}</textarea></label>
        <label class="field span-2"><span>Desired outcome</span><textarea name="goals" rows="2" placeholder="What would success look like?">${esc(p.goals||'')}</textarea></label>
        <label class="field span-2"><span>Observed examples</span><textarea name="examples" rows="2" placeholder="A real behavior or recurring situation that can confirm or challenge the interpretation.">${esc(p.examples||'')}</textarea></label>
      </div></details>
      <details class="form-section" open><summary><span>2</span>Predictive Index data</summary><div class="form-section-body"><div class="human-note"><strong>Internal input:</strong> exact values help the engine read intensity and factor relationships. Client-facing outputs will describe the person in words—not as plus/minus scores or standard deviations.</div>
        <div class="inline-controls"><label class="field"><span>Input depth</span><select name="piMode"><option value="full" ${p.pi.mode!=='profile_only'?'selected':''}>Full behavioral pattern</option><option value="profile_only" ${p.pi.mode==='profile_only'?'selected':''}>Reference Profile only</option></select></label>
        <label class="field"><span>Reference Profile</span><select name="referenceProfile"><option value="">Not supplied</option>${PROFILE_NAMES.map(n=>`<option ${p.pi.referenceProfile===n?'selected':''}>${n}</option>`).join('')}</select></label></div>
        <div id="fullPiInputs" class="${p.pi.mode==='profile_only'?'hidden':''}">

          <div id="synthesisInputs" class="${hasSynth?'':'hidden'}">${factorInput('synthesis','Synthesis — supplied current expression',p.pi.synthesis||p.pi.self,true)}</div>
          <div class="grid-3 compact-fields">${field('Self Factor M','mSelf',p.pi.mSelf??'','number','Optional')}${field('Self-Concept Factor M','mSelfConcept',p.pi.mSelfConcept??'','number','Optional')}${field('Factor E','factorE',p.pi.factorE??'','number','−3 subjective to +3 objective')}</div>
        </div>
      </div></details>
      <details class="form-section" open><summary><span>3</span>CliftonStrengths data</summary><div class="form-section-body">
        <div class="inline-controls"><label class="field"><span>Profile depth</span><select name="profileType"><option ${p.clifton.profileType==='Top5'?'selected':''}>Top5</option><option ${p.clifton.profileType==='Top10'?'selected':''}>Top10</option><option ${p.clifton.profileType==='Full34'?'selected':''}>Full34</option></select></label>
        <button type="button" class="button ghost" data-action="fill-themes">Fill unused themes</button></div>
        <p class="form-help">Order matters. The engine respects theme rank, then translates the combination into everyday language rather than treating the themes like a scorecard.</p>
        <div id="themeRankBuilder" class="rank-builder">${themeRankBuilder(p.clifton)}</div>
      </div></details>
      <div class="editor-actions"><button type="submit" class="button primary">${icon('save')} Save profile and generate</button>${!isNew?`<button type="button" class="button danger ghost" data-action="delete-person" data-id="${p.id}">${icon('trash')} Delete</button>`:''}<span class="save-note">Printable outputs update after save.</span></div>
    </form>`;
  }

  function field(label,name,value,type='text',placeholder=''){
    const attrs=type==='number'?'step="0.01"':'';
    return `<label class="field"><span>${label}</span><input type="${type}" name="${name}" value="${esc(value??'')}" placeholder="${esc(placeholder)}" ${attrs}></label>`;
  }
  function selectField(label,name,value,options){ return `<label class="field"><span>${label}</span><select name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`; }

  function themeRankBuilder(c){
    const count=c.profileType==='Full34'?34:c.profileType==='Top10'?10:5;
    const ranks=[...(c.ranks||[])]; while(ranks.length<count) ranks.push('');
    return Array.from({length:count},(_,i)=>`<label class="rank-row"><span>${i+1}</span><select name="themeRank"><option value="">Select theme</option>${THEME_NAMES.map(n=>`<option ${ranks[i]===n?'selected':''}>${n}</option>`).join('')}</select></label>`).join('');
  }

  function reportToolbar(p,a){
    const modes=[['quick','Client Guide'],['readback','Relational Readback'],['coach','Consultant Deep Dive'],['manager','Leader / Manager Guide']];
    return `<div class="report-toolbar"><div><span class="eyebrow">Generated output</span><strong>${esc(p.name)}</strong>${confidenceBadge(a.overallConfidence)}</div><div class="report-controls"><select id="personReportMode">${modes.map(([v,l])=>`<option value="${v}" ${state.personReportMode===v?'selected':''}>${l}</option>`).join('')}</select><button class="button ghost compact" data-action="copy-report">Copy</button><button class="button ghost compact" data-action="print-report">${icon('print')} Print / PDF</button><button class="button ghost compact" data-action="download-report">${icon('download')} HTML</button></div></div>`;
  }

  function reportHeader(a,title,kicker='Whole-person consulting read'){ const p=a.person; return `<header class="report-header"><div><span class="report-kicker">${kicker}</span><h1>${esc(title)}</h1><p>${esc(p.name)} · ${esc(p.role||'Role not entered')}${p.organization?` · ${esc(p.organization)}`:''}</p></div><div class="report-confidence"><small>Working read</small>${confidenceBadge(a.overallConfidence)}</div></header>`; }
  function themeChips(a,n=5){ return a.clifton.ranked.slice(0,n).map(r=>`<span class="chip ${domainClass(r.theme.domain)}"><strong>${r.rank}</strong>${esc(r.theme.name)}</span>`).join(''); }

  function evidenceDetails(insight){
    return `<details class="evidence"><summary>What is informing this read · ${esc(insight.confidence.label)}</summary><div>${insight.evidence.map(e=>`<p><strong>${esc(humanEvidenceLabel(e))}</strong><span>${esc(e.source)}</span>${esc(e.detail||'')}</p>`).join('')}<p class="validation"><strong>Test it:</strong> ${esc(insight.validationQuestion)}</p></div></details>`;

        <p>There may also be a gap between how you experience yourself and how someone else experiences you. At your best, people may count on you for ${esc(joinNatural([...a.pi.factors.slice(0,2).map(f=>f.contribution.toLowerCase()),...a.clifton.top5.slice(0,2).map(r=>r.theme.contribution.toLowerCase())]))}. When pressure rises, some of those same strengths can turn up too far: ${esc(joinNatural([...a.pi.factors.slice(0,2).map(f=>f.pressure.toLowerCase()),...a.clifton.top5.slice(0,2).map(r=>r.theme.overuse.toLowerCase())]))}.</p>

  function bar(value,max,label,cls=''){ const pct=max?Math.max(2,Math.round(value/max*100)):0; return `<div class="simple-bar"><span style="width:${pct}%" class="${cls}"></span></div><small>${esc(label)}</small>`; }
  function renderTeamReport(t){
    const maxTheme=Math.max(1,...t.themeFrequency.map(x=>x[1]));
    const maxDomain=Math.max(1,...Object.values(t.domainCounts));
    return `<header class="report-header"><div><span class="report-kicker">Team system · ${t.count} people</span><h1>${esc(t.team.name)}</h1><p>${esc(t.team.strategy||'Strategy not entered')}</p></div></header>
      ${t.privacyWarning?`<section class="report-section coach-warning"><strong>Small-group note</strong><p>${esc(t.privacyWarning)}</p></section>`:''}
      <section class="report-section"><div class="report-section-heading"><span>Talent distribution</span><h2>CliftonStrengths domains and repeated themes</h2></div><div class="team-dashboard"><div><h3>Top-five domain distribution</h3>${Object.entries(t.domainCounts).map(([d,n])=>`<div class="bar-row"><strong>${esc(d)}</strong>${bar(n,maxDomain,`${n} of ${t.count*5} top-five placements`,domainClass(d))}</div>`).join('')}</div><div><h3>Most repeated themes</h3>${t.themeFrequency.slice(0,10).map(([name,n])=>`<div class="bar-row"><strong>${esc(name)}</strong>${bar(n,maxTheme,`${n} of ${t.count} people`)}</div>`).join('')}</div></div><p class="muted">Less represented is not missing capability. It means the pathway may require more intention, partnership or learned skill. In this group: <strong>${esc(t.lessRepresented.join(', ')||'no clear domain gap')}</strong>.</p></section>
      <section class="report-section"><div class="report-section-heading"><span>PI distribution</span><h2>Behavioral range across the group</h2></div><div class="factor-dashboard">${['A','B','C','D'].map(f=>{const x=t.factors[f];return `<article><span class="factor-letter factor-${f.toLowerCase()}">${f}</span><h3>${FACTOR_NAMES_UI[f]}</h3><strong>${x.count?E.formatFactor(x.avg):'—'}</strong><p>Range ${x.count?`${E.formatFactor(x.min)} to ${E.formatFactor(x.max)}`:'not available'}</p></article>`;}).join('')}</div></section>
      <section class="report-section"><div class="report-section-heading"><span>Team dynamics</span><h2>Strongest shared signals and widest differences</h2></div><div class="two-col"><div><h3>Shared emphasis</h3>${t.strongest.map(d=>`<article class="mini-insight"><strong>${esc(d.label)}</strong><p>Average signal ${Math.round(d.avg)} · range ${Math.round(d.range)}</p>${dimensionBar(d.avg,d.label)}</article>`).join('')}</div><div><h3>Widest range</h3>${t.widest.map(d=>`<article class="mini-insight"><strong>${esc(d.label)}</strong><p>${Math.round(d.min)} to ${Math.round(d.max)} · range ${Math.round(d.range)}</p>${dimensionBar(d.avg,d.label)}</article>`).join('')}</div></div></section>
      <section class="report-section"><div class="report-section-heading"><span>Operating agreement</span><h2>Practices for this team to test</h2></div><ol class="development-list agreements">${t.agreements.map((x,i)=>`<li><span>${i+1}</span><p>${esc(x)}</p></li>`).join('')}</ol></section>
      <section class="report-section"><div class="report-section-heading"><span>Facilitator questions</span><h2>Use the distribution to start a real conversation</h2></div><ol class="question-list"><li>Which pattern helps this team deliver its strategy—and which pattern becomes costly under pressure?</li><li>Where does the team have strong natural coverage, and where must it build a deliberate process or partnership?</li><li>Whose voice is likely to be heard first? Whose perspective may arrive later but materially improve the decision?</li><li>What does this team need to agree about pace, decision rights, standards and conflict?</li><li>Which recommendation is supported by a real team example, and which remains a hypothesis?</li></ol></section>
      <footer class="report-footer"><p>Team results show distributions and working hypotheses. They do not create a single “team personality,” and they should be connected to the team’s actual strategy and work.</p></footer>`;
  }

  function renderLibrary(){
    const q=(state.libraryQuery||'').toLowerCase();
    const themes=K.clifton.themes.filter(t=>!q||[t.name,t.domain,t.essence,...t.keywords].join(' ').toLowerCase().includes(q));
    const profiles=K.pi.reference_profiles.filter(p=>!q||[p.name,p.group,p.snapshot,p.contribution].join(' ').toLowerCase().includes(q));
    return shell(`
      ${pageHeader('Method and library','A transparent engine, not a black box','Review the governing model, confidence logic, source boundaries and the original interpretation records that power the reports.')}
      <section class="method-grid"><article><span>1</span><h3>PI interprets work behavior</h3><p>Factors, intensity, all six relationships, Self-Concept adaptation and Synthesis are interpreted before Reference Profile shorthand.</p></article><article><span>2</span><h3>Clifton interprets talent patterns</h3><p>Rank, domains, contributions, needs, overextension and theme dynamics explain how the person tends to create value.</p></article><article><span>3</span><h3>The integrated layer explains interaction</h3><p>Signals can reinforce, channel, moderate, sequence or create constructive tension. Apparent contradiction becomes a question—not an error.</p></article><article><span>4</span><h3>Context validates the hypothesis</h3><p>Role, challenge, power, environment and real examples determine whether a data-supported pattern is visible and useful.</p></article></section>
      <section class="quality-banner"><div>${icon('check')}</div><div><strong>Confidence is evidence strength, not probability of truth.</strong><p>Strong evidence requires reliable inputs, clear salience, cross-system convergence, context and ideally a confirmed example. The studio deliberately withholds unsupported conclusions.</p></div></section>
      <section class="section-block"><div class="section-heading"><div><span class="eyebrow">Searchable library</span><h2>Original interpretation records</h2></div><label class="search-field"><input id="librarySearch" type="search" value="${esc(state.libraryQuery)}" placeholder="Search themes, profiles or keywords"><span>⌕</span></label></div>
        <div class="library-tabs"><button class="active">Clifton themes <span>${themes.length}</span></button><span>PI Reference Profiles <strong>${profiles.length}</strong></span></div>
        <div class="library-grid">${themes.map(t=>`<article class="library-card"><div><span class="domain-dot ${domainClass(t.domain)}"></span><small>${esc(t.domain)}</small></div><h3>${esc(t.name)}</h3><p>${esc(t.essence)}</p><dl><dt>Contribution</dt><dd>${esc(t.contribution)}</dd><dt>Watchout</dt><dd>${esc(t.overuse)}</dd><dt>Coach</dt><dd>${esc(t.coaching_question)}</dd></dl></article>`).join('')}</div>
      </section>
      <section class="section-block"><div class="section-heading"><div><span class="eyebrow">Secondary shorthand</span><h2>PI Reference Profiles</h2></div></div><div class="library-grid profiles">${profiles.map(p=>`<article class="library-card"><div><span class="domain-dot neutral"></span><small>${esc(p.group)}</small></div><h3>${esc(p.name)}</h3><p>${esc(p.snapshot)}</p><dl><dt>Contribution</dt><dd>${esc(p.contribution)}</dd><dt>Watchout</dt><dd>${esc(p.watchouts)}</dd><dt>Manager</dt><dd>${esc(p.manager_guidance)}</dd></dl></article>`).join('')}</div></section>
      <section class="source-boundary"><h2>Source integrity and rights boundary</h2><p>The uploaded PI and Gallup materials inform the methodology, QA and case interpretation. The site uses independently written records and does not reproduce protected reports, cards, tables, branded graphics or extended source wording. It is an independent consulting preparation tool, not an official assessment platform.</p></section>
    `);
  }

  function render(){
    const views={dashboard:renderDashboard,individuals:renderIndividuals,relationships:renderRelationships,teams:renderTeams,library:renderLibrary};
    $('#app').innerHTML=(views[state.view]||renderDashboard)();
    bindEvents();
  }

  function bindEvents(){
    $$('[data-view]').forEach(el=>el.addEventListener('click',()=>setView(el.dataset.view)));
    $$('[data-action="new-person"]').forEach(el=>el.addEventListener('click',startNewPerson));
    $$('[data-action="select-person"]').forEach(el=>el.addEventListener('click',()=>{state.draftPerson=null;state.editingPersonId=el.dataset.id;render();}));
    $$('[data-action="edit-person"]').forEach(el=>el.addEventListener('click',()=>{state.draftPerson=null;state.editingPersonId=el.dataset.id;setView('individuals');}));
    $$('[data-action="analyze-person"]').forEach(el=>el.addEventListener('click',()=>{state.draftPerson=null;state.editingPersonId=el.dataset.id;state.personReportMode='quick';setView('individuals');setTimeout(()=>$('#personReport')?.scrollIntoView({behavior:'smooth'}),50);}));
    const form=$('#personForm'); if(form) bindPersonForm(form);
    $('#personReportMode')?.addEventListener('change',e=>{state.personReportMode=e.target.value;const a=analysisFor(state.editingPersonId);$('#personReport').innerHTML=renderPersonReport(a,state.personReportMode);});
    $$('[data-action="print-report"]').forEach(el=>el.addEventListener('click',()=>printElement($('#personReport'),`${personById(state.editingPersonId)?.name||'Person'} — ${state.personReportMode}`)));
    $$('[data-action="download-report"]').forEach(el=>el.addEventListener('click',()=>downloadElement($('#personReport'),`${slugFile(personById(state.editingPersonId)?.name)}-${state.personReportMode}.html`)));
    $$('[data-action="copy-report"]').forEach(el=>el.addEventListener('click',()=>copyReport($('#personReport'))));
    $$('[data-action="delete-person"]').forEach(el=>el.addEventListener('click',()=>deletePerson(el.dataset.id)));
    $('[data-action="generate-relationship"]')?.addEventListener('click',generateRelationship);
    $('[data-action="print-rel-report"]')?.addEventListener('click',()=>printElement($('#relationshipReport'),'Working Relationship Guide'));
    $('[data-action="download-rel-report"]')?.addEventListener('click',()=>downloadElement($('#relationshipReport'),'working-relationship-guide.html'));
    $('[data-action="generate-team"]')?.addEventListener('click',generateTeam);
    $('[data-action="print-team-report"]')?.addEventListener('click',()=>printElement($('#teamReport'),'Team Brief'));
    $('[data-action="download-team-report"]')?.addEventListener('click',()=>downloadElement($('#teamReport'),'team-brief.html'));
    $('#librarySearch')?.addEventListener('input',e=>{state.libraryQuery=e.target.value;clearTimeout(window.__libTimer);window.__libTimer=setTimeout(render,150);});
    $('#exportWorkspace')?.addEventListener('click',exportWorkspace);
    $('#importWorkspace')?.addEventListener('click',()=>$('#importFile')?.click());
    $('#importFile')?.addEventListener('change',importWorkspace);
  }

  function bindPersonForm(form){
    const piMode=form.elements.piMode;
    piMode?.addEventListener('change',()=>$('#fullPiInputs').classList.toggle('hidden',piMode.value==='profile_only'));
    form.elements.hasSelfConcept?.addEventListener('change',e=>$('#selfConceptInputs').classList.toggle('hidden',!e.target.checked));
    form.elements.hasSynthesis?.addEventListener('change',e=>$('#synthesisInputs').classList.toggle('hidden',!e.target.checked));
    function syncFactorHuman(path,value){const code=path.split('.').pop();const h=$(`[data-factor-human="${path}"]`,form);if(h)h.textContent=factorHumanInput(code,value);}
    $$('[data-factor-range]',form).forEach(r=>r.addEventListener('input',()=>{const n=$(`[data-factor-number="${r.dataset.factorRange}"]`,form);if(n)n.value=r.value;syncFactorHuman(r.dataset.factorRange,r.value);}));
    $$('[data-factor-number]',form).forEach(n=>n.addEventListener('input',()=>{const r=$(`[data-factor-range="${n.dataset.factorNumber}"]`,form);if(r)r.value=n.value;syncFactorHuman(n.dataset.factorNumber,n.value);}));
    form.elements.profileType?.addEventListener('change',()=>{const current=$$('select[name="themeRank"]',form).map(x=>x.value);$('#themeRankBuilder').innerHTML=themeRankBuilder({profileType:form.elements.profileType.value,ranks:current});});
    $('[data-action="fill-themes"]',form)?.addEventListener('click',()=>{const selects=$$('select[name="themeRank"]',form),used=new Set(selects.map(s=>s.value).filter(Boolean));let unused=THEME_NAMES.filter(n=>!used.has(n));selects.forEach(s=>{if(!s.value)s.value=unused.shift()||'';});});
    form.addEventListener('submit',savePersonFromForm);
  }

  function pathFactor(form,path){ const [group,f]=path.split('.'); const input=$(`[data-factor-number="${group}.${f}"]`,form); return input?Number(input.value):0; }
  function savePersonFromForm(e){
    e.preventDefault(); const form=e.currentTarget,id=form.dataset.id; const existing=personById(id)||(state.draftPerson?.id===id?state.draftPerson:null); const fd=new FormData(form);
    const hasSC=!!form.elements.hasSelfConcept?.checked, hasSynth=!!form.elements.hasSynthesis?.checked;
    const p={...(existing||{}),id,name:String(fd.get('name')||'').trim()||'Unnamed Person',role:String(fd.get('role')||'').trim(),organization:String(fd.get('organization')||'').trim(),purpose:String(fd.get('purpose')||''),audience:String(fd.get('audience')||''),challenge:String(fd.get('challenge')||'').trim(),goals:String(fd.get('goals')||'').trim(),examples:String(fd.get('examples')||'').trim(),
      pi:{mode:String(fd.get('piMode')||'full'),referenceProfile:String(fd.get('referenceProfile')||''),self:Object.fromEntries(['A','B','C','D'].map(f=>[f,pathFactor(form,`self.${f}`)])),selfConcept:hasSC?Object.fromEntries(['A','B','C','D'].map(f=>[f,pathFactor(form,`selfConcept.${f}`)])):null,synthesis:hasSynth?Object.fromEntries(['A','B','C','D'].map(f=>[f,pathFactor(form,`synthesis.${f}`)])):null,mSelf:fd.get('mSelf'),mSelfConcept:fd.get('mSelfConcept'),factorE:fd.get('factorE')},
      clifton:{profileType:String(fd.get('profileType')||'Top5'),ranks:$$('select[name="themeRank"]',form).map(s=>s.value).filter(Boolean)},
      createdAt:existing?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
    const idx=workspace.people.findIndex(x=>x.id===id); if(idx>=0)workspace.people[idx]=p;else workspace.people.unshift(p);
    state.editingPersonId=p.id; state.draftPerson=null; saveWorkspace(); render(); setTimeout(()=>$('#personReport')?.scrollIntoView({behavior:'smooth',block:'start'}),50);
  }

  function deletePerson(id){ if(!confirm('Delete this saved person from the local workspace?'))return; workspace.people=workspace.people.filter(p=>p.id!==id);state.editingPersonId=workspace.people[0]?.id||null;state.draftPerson=null;saveWorkspace();render(); }

  function generateRelationship(){
    const aId=$('#relA')?.value,bId=$('#relB')?.value,type=$('#relType')?.value||'peer';
    if(!aId||!bId||aId===bId){alert('Select two different saved people.');return;}
    const analysis=E.analyzeRelationship(personById(aId),personById(bId),type); state.relationship={aId,bId,type,analysis};render();setTimeout(()=>$('#relationshipReport')?.scrollIntoView({behavior:'smooth'}),50);
  }
  function generateTeam(){
    const ids=$$('input[name="teamMember"]:checked').map(x=>x.value); if(ids.length<2){alert('Select at least two people.');return;}
    const team={name:$('input[name="teamName"]')?.value||'Team',strategy:$('input[name="teamStrategy"]')?.value||'',challenge:$('#teamChallenge')?.value||''};
    state.teamAnalysis=E.analyzeTeam(team,ids.map(personById));render();setTimeout(()=>$('#teamReport')?.scrollIntoView({behavior:'smooth'}),50);
  }

  function reportDocument(inner,title){
    return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>${PRINT_CSS}
.empty-state{border:1px dashed var(--line-dark);background:#fff;border-radius:18px;padding:34px;text-align:center;color:var(--muted);grid-column:1/-1}.empty-state h3{margin:4px 0 8px;color:var(--navy);font-size:20px}.empty-state p{max-width:560px;margin:0 auto 18px}.factor-human{font-size:11px;font-weight:750;color:var(--teal);min-width:180px;text-align:right}.human-note{background:var(--teal-soft);border:1px solid #cae5e1;border-radius:12px;padding:12px 14px;color:var(--navy);font-size:12px;line-height:1.5;margin:12px 0 4px}.word-cloud{display:flex;gap:8px;flex-wrap:wrap}.word-chip{display:inline-flex;padding:7px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal-dark);font-size:11px;font-weight:800}.report-philosophy{padding:15px 17px;border-radius:13px;background:linear-gradient(135deg,#edf7f5,#f8fbfa);border:1px solid #d5ebe7;color:var(--navy);margin:0 0 18px}.report-philosophy strong{color:var(--teal-dark)}
@media(max-width:700px){.factor-human{min-width:0;text-align:left;grid-column:1/-1}.factor-row{grid-template-columns:1fr}.factor-row input[type=range],.factor-row input[type=number]{width:100%}}
</style></head><body><main class="report-paper">${inner}</main></body></html>`;
  }
  function printElement(el,title){ if(!el)return; const w=window.open('','_blank'); if(!w){alert('Allow pop-ups to print this report.');return;} w.document.open();w.document.write(reportDocument(el.innerHTML,title));w.document.close();setTimeout(()=>{w.focus();w.print();},250); }
  function downloadElement(el,filename){ if(!el)return; const blob=new Blob([reportDocument(el.innerHTML,filename)],{type:'text/html'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000); }
  async function copyReport(el){ if(!el)return; try{await navigator.clipboard.writeText(el.innerText);alert('Report text copied.');}catch{alert('Copy was blocked by the browser. Select the report text and copy manually.');} }
  function slugFile(s){return String(s||'report').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

  function exportWorkspace(){ const blob=new Blob([JSON.stringify(workspace,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pi-clifton-studio-workspace.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000); }
  function importWorkspace(e){ const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.people))throw new Error('No people array');workspace=data;state.editingPersonId=workspace.people[0]?.id||null;state.draftPerson=null;saveWorkspace();render();alert('Workspace imported.');}catch(err){alert(`Could not import this workspace: ${err.message}`);}};reader.readAsText(file); }

  const PRINT_CSS=`
