name: Build v1.1 app

on:
  push:
    paths:
      - 'builder/build_v11.py.gz.b64'
      - '.github/workflows/build-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified builder
        run: |
          base64 -d builder/build_v11.py.gz.b64 | gunzip > build_v11.py
          echo "3fd72ea4fe4bac832a333df6f17a9ada566781a42b7952a24ecdefb7bd97050b  build_v11.py" | sha256sum -c -

      - name: Build and validate v1.1
        run: python build_v11.py

      - name: Commit generated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v11.html
          git diff --cached --quiet || git commit -m "Build v1.1 app"
          git push
