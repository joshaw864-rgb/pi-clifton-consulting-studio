name: Build v1.1 app

on:
  push:
    paths:
      - 'builder/build_v11_p1.txt'
      - 'builder/build_v11_p2.txt'
      - 'builder/build_v11_p3.txt'
      - 'builder/build_v11_p4.txt'
      - 'builder/build_v11_p5.txt'
      - '.github/workflows/build-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble builder
        run: cat builder/build_v11_p1.txt builder/build_v11_p2.txt builder/build_v11_p3.txt builder/build_v11_p4.txt builder/build_v11_p5.txt > build_v11.py

      - name: Build and validate v1.1
        run: python build_v11.py

      - name: Commit generated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v11.html
          git diff --cached --quiet || git commit -m "Build v1.1 app"
          git push
